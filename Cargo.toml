[package]
name = "pd2-price-filter"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Project Diablo 2 filter price decorator"
default-run = "pd2-price-filter"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "pd2-price-filter"
path = "rust/main.rs"


[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

same-file = "1"
tempfile = "3"
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
